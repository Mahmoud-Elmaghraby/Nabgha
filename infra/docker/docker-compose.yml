services:
  postgres:
    image: postgres:16-alpine
    container_name: nabgha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabgha
      POSTGRES_PASSWORD: nabgha123
      POSTGRES_DB: nabgha
    ports:
      - "5433:5432"
    volumes:
      - nabgha_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nabgha_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - nabgha_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nabgha_minio
    restart: unless-stopped
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - nabgha_minio_data:/data

volumes:
  nabgha_postgres_data:
  nabgha_redis_data:
  nabgha_minio_data:
