<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="نبغة — برنامج إدارة المدرسين والسناتر: حضور بالباركود، رسائل واتساب تلقائية لأولياء الأمور، درجات وامتحانات، ومستحقات وتحصيل. بيشتغل من غير إنترنت." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="نبغة" />
    <meta property="og:title" content="نبغة — طلابك ومجموعاتك وحساباتك من غير كشكول" />
    <meta property="og:description" content="حضور بالباركود، رسائل واتساب تلقائية لأولياء الأمور، درجات، ومستحقات وتحصيل — برنامج واحد للمدرس والسنتر." />
    <meta property="og:image" content="/Logo-icon-1024.png" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="theme-color" content="#0E3B2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نبغة" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>نبغة — برنامج إدارة المدرسين والسناتر</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- شاشة التحميل لحد ما React يرسم (React بيشيلها لوحده). نسخة الديسكتوب بتستنى اختفاءها قبل ما تظهر الشباك -->
      <div id="nabgha-boot" aria-label="جاري التحميل">
        <style>
          #nabgha-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(120% 90% at 50% 35%, #15513F 0%, #0E3B2E 55%, #082A20 100%); color: #fff;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif; z-index: 9999; }
          #nabgha-boot img { height: 110px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); animation: nb-breathe 2.4s ease-in-out infinite; }
          #nabgha-boot .t { margin-top: 12px; font-size: 32px; font-weight: 800; }
          #nabgha-boot .bar { margin-top: 22px; width: 160px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
          #nabgha-boot .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #B8902F, #E6C46E);
            animation: nb-slide 1.1s ease-in-out infinite; }
          @keyframes nb-breathe { 0%,100% { transform: scale(.97); opacity: .9; } 50% { transform: scale(1.03); opacity: 1; } }
          @keyframes nb-slide { from { transform: translateX(260%); } to { transform: translateX(-160%); } }
        </style>
        <img src="/brand/nabgha-mark.webp" alt="">
        <div class="t">نبغة</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
